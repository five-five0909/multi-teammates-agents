[run]
host = "codex"
max_rounds = 20
retry_limit = 2
max_concurrency = 4
human_completion_gate = true
# workspace = "."
# model = "host-default-model"

[run.timeouts]
manager = 600
executor = 1800
auditor = 600

[run.context]
manager = 48000
executor = 32000
auditor = 40000

[run.output]
manager = 64000
executor = 200000
auditor = 100000

# Per-role values inherit [run] and may override host/model/budgets.
# [run.roles.auditor]
# host = "claude"
# model = "strong-auditor-model"
# timeout_seconds = 600

# Copy this file to .expert-team/config.toml when managed configuration is
# needed. Never place API keys, tokens, passwords, or secrets in that file.
# Runners inherit host authentication from the active user environment.
